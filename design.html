<!DOCTYPE html>
<html>
<head>
<title>Student Registration Form</title>

<style>

body{
font-family: Arial;
background:#f2f2f2;
}

.container{
width:400px;
margin:40px auto;
background:orange;
padding:30px;
border-radius:8px;
}

h2{
text-align:center;
}

p{
text-align:center;
}

label{
display:block;
margin-top:10px;
font-weight:bold;
}

input, select{
width:100%;
padding:8px;
margin-top:5px;
border-radius:4px;
border:1px solid #ccc;
}

.gender{
width:auto;
}

button{
margin-top:15px;
padding:10px;
width:100%;
background:#eee;
border:none;
cursor:pointer;
font-size:16px;
}

button:hover{
background:#ddd;
}

</style>

</head>

<body>

<div class="container">

<h2>Student Registration Form</h2>
<p>Fill in this form to register</p>

<form>

<label>First Name</label>
<input type="text" placeholder="Enter your first name">

<label>Last Name</label>
<input type="text" placeholder="Enter your last name">

<label>E-mail</label>
<input type="email" placeholder="Enter your e-mail">

<label>Date of Birth</label>
<input type="date">

<label>Set Username</label>
<input type="text" placeholder="Set Username">

<label>Set Password</label>
<input type="password" placeholder="Set password">

<label>Gender</label>
<input class="gender" type="radio" name="gender"> Male<br>
<input class="gender" type="radio" name="gender"> Female<br>
<input class="gender" type="radio" name="gender"> Others

<label>Course</label>
<select>
<option>Course</option>
<option>B.Tech</option>
<option>BCA</option>
<option>MCA</option>
<option>B.Sc</option>
</select>

<button type="submit">Register</button>

</form>

</div>

</body>
</html>
